[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpyolo"
version = "0.1.0"
description = "FloorPlanCAD to Ultralytics YOLO datasets and YOLO11n training"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.3,<9",
    "svgelements",
    "shapely>=2.0",
    "numpy",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pycocotools"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
